        <!-- ============================================================
             INDIRIZZO CANONICO E LINGUE

             Il sito e' UNA PAGINA SOLA e la lingua vive in ?lang=. Senza
             canonical, "/", "/?lang=it" e "/?lang=de" sono tre indirizzi
             che per un motore di ricerca portano la stessa pagina, e la
             forza si divide fra copie invece di sommarsi su una.

             hreflang dichiara che sono la stessa pagina in lingue diverse:
             finora tedesco, inglese e francese, per Google, non esistevano.
             x-default e' la versione da mostrare a chi non rientra in
             nessuna delle quattro.
             ============================================================ -->
        <link rel="canonical" href="https://www.hoteltermeleonardo.com/" />
        <link rel="alternate" hreflang="it" href="https://www.hoteltermeleonardo.com/?lang=it" />
        <link rel="alternate" hreflang="de" href="https://www.hoteltermeleonardo.com/?lang=de" />
        <link rel="alternate" hreflang="en" href="https://www.hoteltermeleonardo.com/?lang=en" />
        <link rel="alternate" hreflang="fr" href="https://www.hoteltermeleonardo.com/?lang=fr" />
        <link rel="alternate" hreflang="x-default" href="https://www.hoteltermeleonardo.com/" />

             riga di testo nuda, senza foto e senza titolo. E' vetrina
             regalata a nessuno.
             ============================================================ -->
