        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

            <meta name="description" content="Hotel 4 stelle termale ad Abano Terme, sui Colli Euganei: piscine termali 30-35 gradi, grotte, cure convenzionate SSN e campo pratica golf." />
        <!-- ============================================================
             I CARATTERI, DICHIARATI QUI E NON DENTRO IL CSS

             Prima il foglio di stile li chiedeva con un @import: il browser
             scaricava il CSS, lo leggeva, e SOLO ALLORA scopriva che doveva
             chiedere i caratteri a Google — tre viaggi in fila prima di
             disegnare una riga. Dichiarati qui partono insieme al resto.

             Solo i pesi che la pagina usa davvero: il Cormorant leggero e
             normale per i titoli (piu' il corsivo del titolo grande), il
             Manrope dal 300 al 700 per il testo. L'Inter che stava qui non
             era usato da nessuna parte.
             ============================================================ -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- media="print" e poi onload: il browser scarica il foglio dei
             caratteri senza fermarsi ad aspettarlo, e lo applica appena
             arriva. Con display=swap il testo intanto si legge col carattere
             di riserva. Lighthouse sulla costruzione locale contava due
             secondi di attesa su questo foglio. Il noscript e' per chi ha
             JavaScript spento, che senza vedrebbe i caratteri di sistema. -->
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
        <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" /></noscript>

        <!-- ============================================================
             LA PRIMA FOTOGRAFIA, PREANNUNCIATA

             E' la foto a tutto schermo in cima alla pagina, quella su cui
             si misura quanto ci mette il sito ad aprirsi. Senza questa
             riga il browser la scopre solo dopo aver scaricato ed
             eseguito tutto il JavaScript: cosi' la chiede subito, nella
             misura giusta per lo schermo. Indirizzo e misure sono quelli
             di src/foto.js (voce «vista»): foto.test.ts controlla che
             coincidano, perche' un preload di un file che poi non si usa
             e' peso puro.
             ============================================================ -->
        <link rel="preload" as="image" href="/foto/vista.50cbd6ef.1280.webp" imagesrcset="/foto/vista.50cbd6ef.640.webp 640w, /foto/vista.50cbd6ef.1280.webp 1280w, /foto/vista.50cbd6ef.1920.webp 1920w" imagesizes="100vw" />

        -->
                    <title>Hotel Terme Leonardo | 4 stelle termale ad Abano Terme</title>

        <!-- ============================================================
             INDIRIZZO CANONICO E LINGUE

             Il sito e' UNA PAGINA SOLA e la lingua vive in ?lang=. Senza
             canonical, "/", "/?lang=it" e "/?lang=de" sono tre indirizzi
             che per un motore di ricerca portano la stessa pagina, e la
             forza si divide fra copie invece di sommarsi su una.

             hreflang dichiara che sono la stessa pagina in lingue diverse:
             finora tedesco, inglese e francese, per Google, non esistevano.
             x-default e' la versione da mostrare a chi non rientra in
             nessuna delle quattro.
             ============================================================ -->
        <link rel="canonical" href="https://www.hoteltermeleonardo.com/" />
        <link rel="alternate" hreflang="it" href="https://www.hoteltermeleonardo.com/?lang=it" />
        <link rel="alternate" hreflang="de" href="https://www.hoteltermeleonardo.com/?lang=de" />
        <link rel="alternate" hreflang="en" href="https://www.hoteltermeleonardo.com/?lang=en" />
        <link rel="alternate" hreflang="fr" href="https://www.hoteltermeleonardo.com/?lang=fr" />
        <link rel="alternate" hreflang="x-default" href="https://www.hoteltermeleonardo.com/" />

        <!-- ============================================================
             ANTEPRIMA QUANDO IL LINK VIENE CONDIVISO

             Un albergo si passa fra amici che organizzano un weekend: il
             link finisce su WhatsApp, e senza questi tag arrivava come una
             riga di testo nuda, senza foto e senza titolo. E' vetrina
             regalata a nessuno.
             ============================================================ -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Hotel Terme Leonardo" />
        <meta property="og:locale" content="it_IT" />
        <meta property="og:title" content="Hotel Terme Leonardo — 4 stelle termale ad Abano Terme" />
        <meta property="og:description" content="Piscine termali 30-35 °C, centro grotte, cure convenzionate SSN e campo pratica golf, sui Colli Euganei." />
        <meta property="og:url" content="https://www.hoteltermeleonardo.com/" />
        <meta property="og:image" content="https://www.hoteltermeleonardo.com/img/og-hotel.jpg" />
        <meta property="og:image:alt" content="Le piscine termali dell'Hotel Terme Leonardo" />
        <meta name="twitter:card" content="summary_large_image" />
